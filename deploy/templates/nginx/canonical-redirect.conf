# Tunnel alias target: the canonical hostname must route directly to the app,
# not back to this redirect vhost. Install instead of another HTTP vhost for
# these names; retain separately managed TLS vhosts as required.
server {
    listen @NGINX_HTTP_LISTEN@;
    server_name @NGINX_SERVER_NAMES@;

    location /.well-known/acme-challenge/ {
        root @NGINX_ACME_ROOT@;
    }

    location = /health {
        proxy_pass @NGINX_BACKEND_UPSTREAM@/health;
        proxy_set_header Host $host;
    }

    location / {
        return 308 @NGINX_CANONICAL_ORIGIN@$request_uri;
    }
}
